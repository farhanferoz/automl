  - _toys_all
  - /protocol@protocol: cards_5bc
  - /hpo@hpo: tpe20
  - /model@variants.probreg: probreg_tuned
  - /model@variants.plain_nn: plain_nn
  - /model@variants.plain_nn_matched: plain_nn_matched
  - /model@variants.lightgbm: lightgbm
  - /model@variants.linear: linear
