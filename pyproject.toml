[project]
name = "automl-package"
version = "0.1.0"
description = "Automated Machine Learning framework with probabilistic regression and dynamic neural architectures"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2",
    "pandas",
    "scikit-learn",
    "optuna>=4.5",
    "joblib",
    "matplotlib>=3.10",
    "seaborn",
    "jax>=0.7",
    "jaxlib>=0.7",
    "catboost",
    "xgboost",
    "lightgbm",
    "scipy",
    "shap",
    "bokeh",
    "wandb>=0.21",
    "hessianfree @ git+https://github.com/ltatzel/PyTorchHessianFree.git@main",
]

[project.optional-dependencies]
# PyTorch is chosen per machine: install exactly one of these (`uv sync --extra cu132`, `--extra xpu` or `--extra cpu`);
# without one, PyTorch is not installed. xpu is the Intel laptop build; cu132 is the CUDA 13.2 build, which needs an
# NVIDIA driver of the 580 series or newer (the DGX Spark boxes); cpu is the CPU-only build.
xpu = ["torch>=2.6", "triton-xpu>=3.2"]
cu132 = ["torch>=2.15.0"]
cpu = ["torch>=2.6"]
dev = ["pytest>=9.0", "ruff"]
experiments = ["hydra-core>=1.3"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automl_package*"]

# https://docs.astral.sh/uv/guides/integration/pytorch/#using-a-pytorch-index
[tool.uv]
conflicts = [[{ extra = "xpu" }, { extra = "cu132" }, { extra = "cpu" }]]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu132", extra = "cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", extra = "cpu" },
]
triton-xpu = { index = "pytorch-xpu", extra = "xpu" }
